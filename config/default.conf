# Kohiko configuration.
#
# Syntax: `key=value`, one per line. `#` starts a comment. `bind=` and
# `exec.<name>=` may be repeated as many times as you like; every other
# key is a single setting (if you repeat it, the last one wins).
#
# Reload without restarting: kohikoctl reload   (or Super+Shift+C below)

# --- layout -------------------------------------------------------------------

general.inner_gap=6
general.outer_gap=8
general.border_size=2
general.border_color_active=0x89b4fa
general.border_color_inactive=0x45475a

# Gaps/border collapse to 0 while a workspace has only one tiled window.
general.smart_gaps=true
general.smart_borders=true

# A new tile is never allowed to shrink itself, or any *other* tile,
# below this size (MIN_USABLE_TILE_WIDTH/HEIGHT) - this floor is the
# *only* thing that ever gates it: a window's own declared minimum
# size (WM_NORMAL_HINTS) is never treated as a requirement for tiling
# it, only ever this. When the current workspace's layout has no room
# left even after trying the other split direction and shrinking
# existing tiles down to this floor, Kohiko looks for another
# workspace that does have room and opens the window there instead; if
# nothing does, it opens floating rather than forcing an undersized
# tile - a window should never go off-screen or become too small to
# use.
general.min_tile_width=100
general.min_tile_height=60

# Some applications (older Java/Swing GUIs, some IDEs, and TLauncher in
# particular) keep fighting whatever tiled geometry Kohiko gives them -
# repeatedly asking to resize themselves back to their own preferred
# size instead of accepting the tile - which is exactly what leads to
# clipped content, stray white space, and parts of the GUI becoming
# unreachable. Kohiko counts these conflicting requests per window
# while it's tiled; once a single window racks up
# general.tiling_misbehavior_threshold of them in a row, Kohiko stops
# forcing it back into a tile and applies general.tiling_misbehavior_fallback
# instead - the count resets to 0 every time the window is freshly
# (re-)tiled, so only *sustained* fighting trips this, not one ordinary
# resize during normal startup. The same fallback also applies at open
# time if no workspace has room for a new tile in the first place.
#
#   floating       Switch the window to floating, centered at its own
#                  preferred size (clamped to the monitor), on the
#                  same workspace it was already on.
#   new_workspace  Move the window - floating, never re-tiled - to
#                  whichever *other* workspace currently has the fewest
#                  windows on it (ties broken by the lowest workspace
#                  number).
general.tiling_misbehavior_threshold=3
general.tiling_misbehavior_fallback=floating

# Session Restore: every window's workspace, tiled/floating state,
# floating geometry, monitor, fullscreen state, and - for a tiled
# window - its actual position in the BSP layout relative to its
# neighbours are all remembered across a restart, so the layout you
# see right after logging back in closely resembles what you actually
# had before logging out (best-effort: a window whose neighbour didn't
# reopen this session just gets placed the ordinary way instead). If a
# `windowrule=` for a window disagrees with what was saved (e.g.
# you've since added `windowrule=workspace:3` for an app that was
# sitting on workspace 1 when Kohiko last exited), this decides which
# one wins:
#   config   configuration rules (windowrule=) override the saved session
#   session  the saved session overrides configuration rules
session.restore_priority=session

# Adaptive placement: learns, per application, which workspace and
# which side of the tiling layout you repeatedly move its windows to
# by hand, and starts placing new windows of that application there
# automatically once the pattern is clear and consistent - during an
# ordinary session, not just after a restart. Never overrides an
# explicit windowrule= or a precise Session Restore match above; only
# fills in when neither has an opinion.
general.adaptive_placement=true

general.bar_height=26

# Whether hovering over a *specific window* steals its focus. This is
# separate from which *monitor* is focused - that always follows the
# mouse pointer (see "Multi-monitor" in the README), on or off here.
general.focus_follows_mouse=true

# Font for the bar/launcher/notepad's own text - a fontconfig pattern
# (e.g. "JetBrains Mono:pixelsize=13"), NOT an XLFD name. Whatever
# single font you name here only has to cover the script(s) you
# mostly type in yourself - Bar/Launcher/Notepad automatically fall
# back to any other installed font that has a given character, so
# Cyrillic, CJK, or anything else typed into a window title, the
# launcher, or the notepad still draws real glyphs instead of a
# missing-glyph box, even if this font doesn't include them. See
# "Fonts and languages" in the README for more.
general.font=monospace:pixelsize=14

# --- workspaces -----------------------------------------------------------------

workspace.count=4

# `workspace<N>=` (N from 1 to workspace.count above) launches
# programs on startup exactly like auto_start_programs below, except
# each one lands on workspace N once its window actually shows up,
# instead of wherever happened to be focused when Kohiko itself
# started. Space-separated, repeatable per workspace, and each entry
# runs exactly like exec.<name>= (through /bin/sh -c, args and all).
# Leave a line out (or empty) to autostart nothing on that workspace.
#
workspace1=zen-browser
workspace2=discord Telegram
workspace3=steam

# --- monitors ----------------------------------------------------------------
# Every monitor XRandR reports gets its own workspace automatically -
# by default, whichever's lowest-numbered isn't already showing on
# another monitor (see MonitorManager::Detect() if you're curious how
# the assignment actually works). `monitor=` pins a *specific* output
# to a specific starting workspace instead, so it's the same one every
# time that output connects rather than whatever happened to be free.
#
# Run `kohikoctl monitors` (with Kohiko already running) to see the
# exact output names XRandR knows your monitors by - the same names
# `xrandr` on its own reports.
#
#   monitor=<output name>,workspace=<N>
#
# Only takes effect for an output that isn't already connected when
# Kohiko starts/reloads - unplugging and replugging a monitor (or a
# `kohikoctl dispatch reload` followed by a hotplug) is what picks up
# a change here; it deliberately never yanks a workspace that's
# already visible somewhere just because a rule for it changed underneath it.
#
# Uncomment and edit for your own output names:
#monitor=HDMI-1,workspace=1
#monitor=DP-1,workspace=2

# --- wallpaper -----------------------------------------------------------------
#
# Six wallpapers ship with Kohiko itself, installed alongside the rest
# of it - see the README's "Wallpaper" section. wallpaper.default
# below is used everywhere neither of the two rule types further down
# applies; comment it out entirely for a plain
# wallpaper.background_color background instead.

wallpaper.default=/usr/local/share/kohiko/wallpapers/violet-peak.png
wallpaper.mode=fill
wallpaper.background_color=0x000000

# Other wallpapers installed alongside the default above, if you'd
# rather use one of these instead (or as a wallpaper.monitor=/
# wallpaper.workspace= rule below):
#   /usr/local/share/kohiko/wallpapers/chicago-skyline.png
#   /usr/local/share/kohiko/wallpapers/abstract-monoliths.png
#   /usr/local/share/kohiko/wallpapers/violet-peak.png
#   /usr/local/share/kohiko/wallpapers/zen-room.png
#   /usr/local/share/kohiko/wallpapers/digital-grid.png

# Independent per-monitor and/or per-workspace wallpapers - each line
# is `<name-or-id>,path=<file>,mode=<fill|fit|center|stretch>` (mode=
# is optional; falls back to wallpaper.mode above if left off). A
# workspace rule wins over a monitor rule wherever both could apply to
# the same screen at once (see WallpaperManager.h if you're curious
# about the exact priority). Run `kohikoctl monitors` to see your own
# output names.
#
#wallpaper.monitor=eDP-1,path=/usr/local/share/kohiko/wallpapers/violet-peak.png
#wallpaper.monitor=HDMI-1,path=/usr/local/share/kohiko/wallpapers/digital-grid.png,mode=fit
#wallpaper.workspace=1,path=/usr/local/share/kohiko/wallpapers/chicago-skyline.png

# --- scratchpad (Super+F1) -------------------------------------------------------

scratchpad.width=70%
scratchpad.height=70%

# --- notepad (Super+N) -----------------------------------------------------------
# A small native scratch-notes box, not a wrapped external editor -
# see the README. Persists to ~/.config/kohiko/notepad.txt.

notepad.width=40%
notepad.height=50%

# --- bar colors (0xRRGGBB - assumes a TrueColor/DirectColor display) -------------

bar.background=0x1e1e2e
bar.foreground=0xcdd6f4
bar.active=0x89b4fa

# --- power menu ---------------------------------------------------------------
#
# The bar's "[Power]" button opens a small popup with exactly these
# three actions, each a plain shell command run through /bin/sh -c.
# The systemd defaults below are the common case; swap in whatever
# your init system/session actually uses (e.g. `loginctl
# suspend`/`elogind`, or a script of your own) if it's not systemd.

power.shutdown_command=systemctl poweroff
power.restart_command=systemctl reboot
power.suspend_command=systemctl suspend

# Kohiko inhibits the system's own display/idle sleep timer while any
# audio or video is actively playing (via D-Bus, no separate polling
# process - see the README's "Display sleep" section), so a movie or
# song doesn't get interrupted by the display dimming/sleeping
# partway through. Turn off if you'd rather the display's own timeout
# apply regardless of playback.
general.inhibit_sleep_during_playback=true

# --- lock screen ---------------------------------------------------------------
#
# Native, PAM-authenticated - see the README's "Native lock screen"
# section, and pam/kohiko in this repo (install it as
# /etc/pam.d/kohiko - without it, every password is rejected).
# Triggered by Super+Shift+L, `kohikoctl dispatch lock`, and
# automatically right before Suspend if lockscreen.after allows it.

lockscreen.background_color=0x1e1e2e
lockscreen.foreground=0xcdd6f4
lockscreen.field_color=0x313244
lockscreen.error_color=0xf38ba8
# lockscreen.font defaults to general.font if left unset
# lockscreen.background_image=/path/to/image.png   (optional, its own
#                                                    independent image)
lockscreen.background_mode=fill
# Shows the desktop wallpaper above instead, per monitor, wherever
# lockscreen.background_image is left unset - see the README's
# "Wallpaper" section. Ignored (background_image always wins) if
# background_image above is actually set to something.
lockscreen.use_desktop_wallpaper=true
# lockscreen.logo=/path/to/logo.png                (optional; 96x96, centered above the password field)

# never   - the lock screen never engages, not even via the manual
#           `lock` command/keybind (a deliberate opt-out, e.g. for a
#           trusted single-user machine that doesn't want one at all)
# manual  - only locks when you ask it to (bind=/`kohikoctl dispatch
#           lock`); Suspend does not lock automatically
# suspend - also locks automatically right before Suspend (default)
# always  - also locks once at Kohiko startup, on top of "suspend"'s
#           automatic-before-Suspend behavior
lockscreen.after=suspend

# Locks automatically after this many minutes with no keyboard/mouse
# input anywhere on the display, independent of lockscreen.after's own
# Suspend/startup triggers above - e.g. lockscreen.after=manual plus
# idle_timeout_minutes=10 locks after 10 idle minutes or on request,
# but never merely for Suspending. 0 disables idle-timeout locking
# entirely (the default). Still fully subject to lockscreen.after=never,
# which disables locking altogether, on-demand or automatic.
lockscreen.idle_timeout_minutes=0

lockscreen.show_clock=true
lockscreen.show_date=true
lockscreen.clock_format=%H:%M
lockscreen.date_format=%A, %B %d
lockscreen.show_hostname=false
lockscreen.show_username=true

# --- autostart --------------------------------------------------------------
#
# Space-separated list of programs to launch automatically once,
# right after Kohiko finishes starting up - no keybind needed, they
# just open with the WM every time it starts. Each one runs exactly
# like `exec.<name>=` below (through /bin/sh -c, on this session's
# DISPLAY), so anything you could put after `exec.terminal=` works
# here too, args and all. Leave the value empty (or delete the line)
# to autostart nothing.
#
# Want a particular one of these to open on a specific workspace
# instead of wherever's current? List it under `workspace<N>=` in the
# "workspaces" section above instead of (not in addition to) here.
auto_start_programs=flameshot

# --- window rules -----------------------------------------------------------------
#
# `windowrule=<action> <selector>` overrides how a specific
# application behaves, for the cases automatic detection can't get
# right on its own - no tiling WM can guess every app's intentions
# correctly 100% of the time, so every serious one (i3's `for_window`,
# Hyprland's `windowrule`, ...) gives you this same kind of escape
# hatch, and Kohiko is no different.
#
# <action> is one of:
#   float         always open floating, sized to its own natural size
#                 (see below), never tiled - regardless of window type.
#   tile          always tile it, strictly, even if it's the kind of
#                 window (a dialog, or one insisting on its own fixed
#                 size) Kohiko would otherwise float automatically.
#   fullscreen    open already fullscreen.
#   nofullscreen  never allow real fullscreen for this app, whether it
#                 asks for it itself or `fullscreen` above/Super+F asks
#                 on its behalf - it stays tiled/floating instead.
#   workspace:N   always open on workspace N, regardless of whichever
#                 workspace is current - e.g. exiling a chat app's
#                 media viewer to its own workspace ("a new virtual
#                 display") instead of covering whatever you're doing.
#
# <selector> is one or more of `class:`, `instance:`, `title:`
# (case-insensitive substring match against WM_CLASS's class/instance
# and the window title), space-separated - a window must match every
# one given to match the rule at all. `kohikoctl dispatch client` (or
# any EWMH-aware tool, e.g. `xprop`) shows you a window's actual
# class/instance/title if you're not sure what to match on.
#
# A window with no explicit rule still behaves exactly as before:
# transient/dialog windows float automatically, and every floating
# window (whether that's automatic or a `float` rule below) opens
# centered at whatever size it actually asked for (WM_NORMAL_HINTS, or
# else its own size at the moment it asked to be mapped) rather than a
# fixed fraction of the screen - so most applications need no rule
# here at all.
#
# flameshot's screenshot overlay has to be genuinely fullscreen to
# work right (a partial-screen overlay can't select the rest of the
# screen); it already asks for real EWMH fullscreen on its own and
# Kohiko honours that automatically, but pinning it down explicitly
# here is one less thing that can go wrong:
windowrule=fullscreen class:flameshot

# A handful of apps (Tlauncher is the classic example - a Java/Swing
# launcher that opens at its own fixed size and fights being resized)
# never ask to tile and will happily float forever if left alone.
# Force them into the layout instead:
# windowrule=tile class:tlauncher

# A chat client's media viewer is exactly the kind of window that
# might want any of the three things `windowrule=` can do, depending
# on taste - uncomment whichever one matches what you actually want
# from it (only one of these three actually makes sense at a time):
# windowrule=fullscreen class:telegram title:photo
# windowrule=workspace:4 class:telegram title:photo
# windowrule=nofullscreen class:telegram title:photo

#
# Comma-separated list of XKB layouts (whatever `setxkbmap -layout`
# accepts - "us", "ua", "de", "ru", ...), applied once at startup and
# again on `kohikoctl reload`. This is real XKB, so every language
# listed works everywhere - in every window Kohiko manages, not just
# some of them - exactly like it would under any other WM.
#
# Kohiko's own keybinds (Super+H/J/K/L and friends) are completely
# unaffected either way: KeyboardManager grabs them by physical
# keycode, not by which language happens to be active, so they keep
# working no matter which layout below is current.
keyboard.layouts=us, ua

# How to switch between the layouts above once more than one is
# listed - any setxkbmap "grp:" option works; this default cycles
# through them with Alt+Shift, desktop-wide. Ignored while only one
# layout is listed above (nothing to toggle between).
keyboard.layout_toggle=grp:alt_shift_toggle

# Example: English + Ukrainian, cycled with Alt+Shift:
# keyboard.layouts=us,ua
# keyboard.layout_toggle=grp:alt_shift_toggle

# --- named programs, referenced from `bind=... exec <name>` below ---------------

exec.terminal=kitty
exec.browser=zen-browser

# Printscreen (below) runs whatever this points to. Swap it for
# whatever screenshot tool you actually have installed/prefer -
# `exec.<name>=` works exactly the same way as exec.terminal/browser
# above: edit the line, no code changes needed.
exec.screenshot=flameshot gui

# Super+D opens Kohiko's own native launcher (see below) rather than
# shelling out to dmenu, but the `exec.<name>=` + `bind=... exec <name>`
# mechanism is still here for anything else you'd rather launch
# externally - e.g. uncomment this and bind a key to `exec launcher`
# if you'd rather use dmenu/rofi/etc instead:
# exec.launcher=dmenu_run

# --- mouse: Hyprland-style BSP dragging ------------------------------------------
#
#   Super+LMB drag : pick up the grabbed window - it detaches and
#                    follows the cursor while nothing else moves, then
#                    swaps places with whatever it's over when you let
#                    go (or slides back home if you let go over nothing
#                    swappable). Geometry never changes - only which
#                    window sits in which tile does.
#   Super+RMB drag : resize - the grabbed window grows/shrinks in the
#                    direction you drag it; its neighbour adjusts to
#                    match automatically.

mouse.swap=SUPER+BTN1
mouse.resize=SUPER+BTN3

# --- keybindings ------------------------------------------------------------------

bind=SUPER+RETURN exec terminal
bind=SUPER+D launcher_toggle
bind=SUPER+N notepad_toggle
bind=SUPER+Q close
bind=SUPER+SPACE toggle_floating
bind=SUPER+F fullscreen
bind=SUPER+F1 scratchpad_toggle
bind=SUPER+SHIFT+L lock
bind=SUPER+R rotate
bind=SUPER+SHIFT+R flip
bind=Print exec screenshot

# Re-scans /usr/share/applications and $HOME right now, without
# restarting Kohiko, so a program or file you just added shows up in
# the launcher immediately - same effect as `kohikoctl reloadlauncher`.
bind=SUPER+SHIFT+D launcher_reload

# Directional focus, dwm/vim-style.
bind=SUPER+H focus left
bind=SUPER+L focus right
bind=SUPER+K focus up
bind=SUPER+J focus down

# Switch workspace.
bind=SUPER+1 workspace 1
bind=SUPER+2 workspace 2
bind=SUPER+3 workspace 3
bind=SUPER+4 workspace 4
#bind=SUPER+5 workspace 5
#bind=SUPER+6 workspace 6
#bind=SUPER+7 workspace 7
#bind=SUPER+8 workspace 8
#bind=SUPER+9 workspace 9
#bind=SUPER+0 workspace 10

# Send the focused window to another workspace.
bind=SUPER+SHIFT+1 movetoworkspace 1
bind=SUPER+SHIFT+2 movetoworkspace 2
bind=SUPER+SHIFT+3 movetoworkspace 3
bind=SUPER+SHIFT+4 movetoworkspace 4
#bind=SUPER+SHIFT+5 movetoworkspace 5
#bind=SUPER+SHIFT+6 movetoworkspace 6
#bind=SUPER+SHIFT+7 movetoworkspace 7
#bind=SUPER+SHIFT+8 movetoworkspace 8
#bind=SUPER+SHIFT+9 movetoworkspace 9
#bind=SUPER+SHIFT+0 movetoworkspace 10

# Multi-monitor: which monitor is "focused" (which one a new window
# opens on, which one `workspace <N>` switches, ...) simply follows the
# mouse pointer - move the cursor onto a monitor and it becomes the
# focused one, no keybind needed (see the README's "Multi-monitor"
# section). `focusmonitor`/`movetomonitor <left|right|up|down|N>`
# still exist as commands (kohikoctl, or bind one yourself) for anyone
# who wants explicit keyboard control instead/as well, but nothing is
# bound to them by default.
#bind=SUPER+PERIOD focusmonitor right
#bind=SUPER+COMMA focusmonitor left
#bind=SUPER+SHIFT+PERIOD movetomonitor right
#bind=SUPER+SHIFT+COMMA movetomonitor left

bind=SUPER+SHIFT+C reload
bind=SUPER+SHIFT+Q quit

# --- Which file manager will be used to open files -----------------------------------

launcher.file_manager=pcmanfm

# --- Launcher (Super+D) --------------------------------------------------------------

# Application entries marked Hidden=true/NoDisplay=true in their
# .desktop file are skipped by default (that's what those keys are
# for) - set this to true to show them anyway.
#launcher.show_hidden=false

# On top of Hidden=/NoDisplay=, a small extra pass skips a handful of
# well-known non-app helper entries that don't set either (MIME
# handlers, updater UIs, uninstallers, ...) - see
# DesktopEntry::LooksLikeHelperEntry. Turn off if it ever hides
# something you actually wanted to see.
#launcher.strict_filtering=true

# Offer to search the web when nothing local matches what's typed.
#launcher.internet_search=true
#launcher.search_when_no_results=true

# Which engine those suggestions use - one of: google, duckduckgo,
# brave, wikipedia, archwiki, github, youtube, custom.
#launcher.default_search_engine=duckduckgo
#launcher.fallback_search_engine=google

# Only used when default/fallback_search_engine=custom - "{query}" is
# replaced with the URL-encoded search text, or it's appended to the
# end if no "{query}" placeholder is given.
#launcher.custom_search_url=

# Smart prefixes always route to a specific engine regardless of the
# above, no matter what's typed after them - "yt cats" opens YouTube,
# "wiki x11" opens Wikipedia, "arch pacman hooks" opens the Arch Wiki,
# "gh kohiko" opens GitHub. Not configurable - see AddInternetMatch()
# in src/Launcher.cpp if you'd like a different set.

# --- Added by Kohiko Settings ---
launcher.default_search_engine=google
launcher.fallback_search_engine=duckduckgo

# --- Added automatically by Kohiko (config migration - see CHANGELOG.md) ---
launcher.show_hidden=false
launcher.strict_filtering=true
launcher.internet_search=true
launcher.search_when_no_results=true
launcher.custom_search_url=
general.inhibit_sleep_during_playback=true
wallpaper.default=/usr/local/share/kohiko/wallpapers/violet-peak.png
wallpaper.mode=fill
wallpaper.background_color=0x000000
lockscreen.font=
lockscreen.background_image=
lockscreen.background_mode=fill
lockscreen.use_desktop_wallpaper=true
lockscreen.logo=
