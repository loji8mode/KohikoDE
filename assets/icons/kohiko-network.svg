  <g stroke="#89b4fa" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M11 21 A20 20 0 0 1 37 21"/>
    <path d="M16.5 27.5 A12.5 12.5 0 0 1 31.5 27.5"/>
    <path d="M22 34 A5.5 5.5 0 0 1 26 34"/>
  </g>

  <circle cx="24" cy="38.5" r="2.6" fill="#89b4fa"/>
</svg>
